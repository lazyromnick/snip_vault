<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnipVault — Code Snippet Library</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* ── Modal overlay ───────────────────────────────────────── */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.65); z-index: 200;
      align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg-2); border: 1px solid var(--border);
      border-radius: var(--radius-lg); width: 90%; max-width: 620px;
      max-height: 90vh; overflow-y: auto;
      display: flex; flex-direction: column;
    }
    .modal-head {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-head h2 { font-size: 15px; font-weight: 600; }
    .modal-close {
      width: 28px; height: 28px; border: none; background: none;
      color: var(--text-2); font-size: 20px; cursor: pointer;
      border-radius: 6px; display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: var(--bg-3); color: var(--text); }
    .modal-body { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
    .modal-foot {
      padding: 14px 20px;
      border-top: 1px solid var(--border);
      display: flex; gap: 8px; justify-content: flex-end;
    }

    /* ── Form fields ─────────────────────────────────────────── */
    .form-row { display: flex; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; flex: 1; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--text-2); }
    .form-group input,
    .form-group select,
    .form-group textarea {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 13px; padding: 8px 10px; outline: none;
      transition: border-color .15s;
    }
    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--accent); }
    .form-group textarea {
      font-family: var(--mono); font-size: 12px;
      resize: vertical; min-height: 160px; line-height: 1.6;
    }
    .form-group select option { background: var(--bg-2); }

    /* ── Buttons ─────────────────────────────────────────────── */
    .btn { padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: none; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .88; }
    .btn-ghost { background: var(--bg-3); color: var(--text-2); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); }
    .btn-danger { background: #3b1111; color: #f87171; border: 1px solid #5b1a1a; }
    .btn-danger:hover { background: #4d1515; }

    /* ── View toggle ──────────────────────────────────────────── */
    .view-list .card-grid { grid-template-columns: 1fr; }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div class="topbar">
      <span class="page-title">All Snippets</span>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search by title, tag, language…" />
      </div>
      <div class="topbar-actions">
        <button class="btn-icon" id="viewToggle" title="Toggle view">
          <svg id="viewIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
        </button>
        <button class="btn-icon" id="openNewModal" title="New snippet">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- Filter / language tabs -->
    <div class="filter-bar" id="filterBar"></div>

    <!-- Card grid -->
    <div id="gridWrap">
      <div class="card-grid" id="cardGrid"></div>
    </div>
  </div>
</div>

<!-- New / Edit Snippet Modal -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modalTitle">New Snippet</h2>
      <button class="modal-close" id="closeModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label for="fTitle">Title</label>
        <input type="text" id="fTitle" placeholder="e.g. Bubble Sort in Python" maxlength="80" />
      </div>
      <div class="form-group">
        <label for="fDesc">Description <span style="color:var(--text-3);font-weight:400">(optional)</span></label>
        <input type="text" id="fDesc" placeholder="Short description of what this snippet does" maxlength="120" />
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="fLang">Language</label>
          <select id="fLang"></select>
        </div>
        <div class="form-group">
          <label for="fCat">Category</label>
          <select id="fCat"></select>
        </div>
      </div>
      <div class="form-group">
        <label for="fCode">Code</label>
        <textarea id="fCode" placeholder="Paste your code here…" spellcheck="false"></textarea>
      </div>
      <div class="form-group">
        <label for="fTags">Tags <span style="color:var(--text-3);font-weight:400">(comma-separated)</span></label>
        <input type="text" id="fTags" placeholder="e.g. beginner, sorting, array" />
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="cancelModal">Cancel</button>
      <button class="btn btn-primary" id="saveModal">Save snippet</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script>
  SV.initStore();

  /* ── State ──────────────────────────────────────────────────── */
  let filterLang = '';
  let filterCat  = '';
  let searchQ    = '';
  let listView   = false;
  let editingId  = null;

  /* ── Read URL params ─────────────────────────────────────────── */
  const params = new URLSearchParams(location.search);
  if (params.get('lang')) filterLang = params.get('lang');
  if (params.get('cat'))  filterCat  = params.get('cat');

  /* ── Sidebar ─────────────────────────────────────────────────── */
  document.getElementById('sidebar').innerHTML = buildSidebar('index');

  /* ── Filter bar ──────────────────────────────────────────────── */
  function buildFilterBar() {
    const snippets = SV.getSnippets();
    const usedLangs = [...new Set(snippets.map(s => s.language))];
    const usedCats  = [...new Set(snippets.map(s => s.category))];

    let html = `<button class="filter-chip ${!filterLang && !filterCat ? 'active' : ''}"
      onclick="setFilter('','')">All</button>`;

    // Language chips
    usedLangs.forEach(id => {
      const l = SV.getLang(id);
      html += `<button class="filter-chip ${filterLang === id && !filterCat ? 'active' : ''}"
        onclick="setFilter('${id}','')">
        <span class="chip-dot" style="background:${l.color}"></span>${l.label}
      </button>`;
    });

    // Category chips
    usedCats.forEach(id => {
      const c = SV.getCat(id);
      html += `<button class="filter-chip ${filterCat === id ? 'active' : ''}"
        onclick="setFilter('','${id}')">
        ${c.icon} ${c.label}
      </button>`;
    });

    document.getElementById('filterBar').innerHTML = html;
  }

  function setFilter(lang, cat) {
    filterLang = lang; filterCat = cat;
    history.replaceState({}, '', lang ? `?lang=${lang}` : cat ? `?cat=${cat}` : '.');
    renderGrid();
    buildFilterBar();
  }

  /* ── Grid render ─────────────────────────────────────────────── */
  function renderGrid() {
    let snippets = SV.getSnippets();

    if (filterLang) snippets = snippets.filter(s => s.language === filterLang);
    if (filterCat)  snippets = snippets.filter(s => s.category  === filterCat);
    if (searchQ) {
      const q = searchQ.toLowerCase();
      snippets = snippets.filter(s =>
        s.title.toLowerCase().includes(q) ||
        (s.description || '').toLowerCase().includes(q) ||
        (s.tags || []).some(t => t.toLowerCase().includes(q)) ||
        SV.getLang(s.language).label.toLowerCase().includes(q)
      );
    }

    const grid = document.getElementById('cardGrid');
    if (!snippets.length) {
      grid.innerHTML = `<div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <strong>No snippets found</strong>
        <p>${searchQ ? 'Try a different search term.' : 'Save your first snippet to get started.'}</p>
        <button class="empty-btn" onclick="openModal()">+ New snippet</button>
      </div>`;
      return;
    }
    grid.innerHTML = snippets.map(s => buildCard(s, '')).join('');
  }

  /* ── Search ──────────────────────────────────────────────────── */
  document.getElementById('searchInput').addEventListener('input', e => {
    searchQ = e.target.value.trim();
    renderGrid();
  });

  /* ── View toggle ─────────────────────────────────────────────── */
  document.getElementById('viewToggle').addEventListener('click', () => {
    listView = !listView;
    document.getElementById('gridWrap').classList.toggle('view-list', listView);
    document.getElementById('viewToggle').classList.toggle('active', listView);
  });

  /* ── Modal ───────────────────────────────────────────────────── */
  document.getElementById('fLang').innerHTML = buildLangOptions('python');
  document.getElementById('fCat').innerHTML  = buildCatOptions('snippet');

  function openModal(id = null) {
    editingId = id;
    const modal = document.getElementById('modalBackdrop');
    document.getElementById('modalTitle').textContent = id ? 'Edit Snippet' : 'New Snippet';
    if (id) {
      const s = SV.getSnippetById(id);
      if (s) {
        document.getElementById('fTitle').value = s.title;
        document.getElementById('fDesc').value  = s.description || '';
        document.getElementById('fLang').value  = s.language;
        document.getElementById('fCat').value   = s.category;
        document.getElementById('fCode').value  = s.code;
        document.getElementById('fTags').value  = (s.tags || []).join(', ');
      }
    } else {
      document.getElementById('fTitle').value = '';
      document.getElementById('fDesc').value  = '';
      document.getElementById('fLang').value  = 'python';
      document.getElementById('fCat').value   = 'snippet';
      document.getElementById('fCode').value  = '';
      document.getElementById('fTags').value  = '';
    }
    modal.classList.add('open');
    document.getElementById('fTitle').focus();
  }

  function closeModal() {
    document.getElementById('modalBackdrop').classList.remove('open');
    editingId = null;
  }

  document.getElementById('openNewModal').addEventListener('click', () => openModal());
  document.getElementById('closeModal').addEventListener('click', closeModal);
  document.getElementById('cancelModal').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', e => {
    if (e.target === e.currentTarget) closeModal();
  });

  document.getElementById('saveModal').addEventListener('click', () => {
    const title = document.getElementById('fTitle').value.trim();
    const code  = document.getElementById('fCode').value.trim();
    if (!title) { showToast('Title is required', '⚠'); return; }
    if (!code)  { showToast('Code cannot be empty', '⚠'); return; }

    const snippet = {
      id:          editingId || SV.generateId(),
      title,
      description: document.getElementById('fDesc').value.trim(),
      language:    document.getElementById('fLang').value,
      category:    document.getElementById('fCat').value,
      code,
      tags:        document.getElementById('fTags').value.split(',').map(t => t.trim()).filter(Boolean),
      favorited:   editingId ? (SV.getSnippetById(editingId)?.favorited || false) : false,
      createdAt:   editingId ? (SV.getSnippetById(editingId)?.createdAt || Date.now()) : Date.now(),
      updatedAt:   Date.now(),
    };
    SV.saveSnippet(snippet);
    closeModal();
    renderGrid();
    buildFilterBar();
    document.getElementById('sidebar').innerHTML = buildSidebar('index');
    showToast(editingId ? 'Snippet updated' : 'Snippet saved', '✓');
  });

  /* Check if opened with ?new=1 */
  if (params.get('new') === '1') {
    history.replaceState({}, '', '.');
    openModal();
  }

  /* ── Init ────────────────────────────────────────────────────── */
  buildFilterBar();
  renderGrid();
</script>
</body>
</html>
