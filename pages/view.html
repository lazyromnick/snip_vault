<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnipVault — View Snippet</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .view-wrap { padding: 28px 32px; max-width: 860px; }

    .breadcrumb {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--text-3); margin-bottom: 20px;
    }
    .breadcrumb a { color: var(--text-3); transition: color .12s; }
    .breadcrumb a:hover { color: var(--accent); }
    .breadcrumb span { color: var(--text-3); }

    .snippet-header { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 22px; }
    .snip-lang-badge {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 800; letter-spacing: -.5px;
      flex-shrink: 0;
    }
    .snip-meta { flex: 1; }
    .snip-title { font-size: 22px; font-weight: 700; letter-spacing: -.4px; }
    .snip-desc  { font-size: 14px; color: var(--text-2); margin-top: 4px; }
    .snip-pills { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 10px; }
    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 12px; padding: 3px 10px;
      border-radius: 20px; border: 1px solid var(--border);
      background: var(--bg-2); color: var(--text-2);
    }

    .action-bar {
      display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
    }
    .btn { padding: 8px 16px; border-radius: var(--radius); font-size: 13px; font-weight: 600; cursor: pointer; border: none; display: flex; align-items: center; gap: 7px; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { opacity: .88; }
    .btn-ghost { background: var(--bg-2); color: var(--text-2); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--bg-3); color: var(--text); }
    .btn-danger { background: #3b1111; color: #f87171; border: 1px solid #5b1a1a; }
    .btn-danger:hover { background: #4d1515; }
    .btn-fav { background: var(--bg-2); color: var(--text-2); border: 1px solid var(--border); }
    .btn-fav.active { background: #2e2400; color: #f5c518; border-color: #5e4800; }

    .code-panel {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      overflow: hidden;
    }
    .code-panel-head {
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      background: var(--bg-2);
    }
    .code-panel-head .lang-label { font-size: 12px; font-weight: 600; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
    .code-panel-head .line-count { font-size: 11px; color: var(--text-3); }
    .code-view {
      padding: 20px 22px;
      font-family: var(--mono);
      font-size: 13px;
      line-height: 1.75;
      color: var(--text);
      overflow-x: auto;
      white-space: pre;
      tab-size: 2;
    }

    /* line numbers */
    .line-nums {
      display: flex;
      gap: 0;
    }
    .line-num-col {
      user-select: none;
      text-align: right;
      padding-right: 18px;
      color: var(--text-3);
      font-size: 12px;
      min-width: 36px;
      line-height: 1.75;
      border-right: 1px solid var(--border);
      margin-right: 18px;
      flex-shrink: 0;
    }
    .code-body { flex: 1; overflow-x: auto; }

    .meta-card {
      margin-top: 20px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 14px;
    }
    .meta-item { display: flex; flex-direction: column; gap: 3px; }
    .meta-label { font-size: 11px; color: var(--text-3); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
    .meta-value { font-size: 13px; color: var(--text); }

    /* confirm delete */
    .confirm-bar {
      display: none; align-items: center; gap: 10px;
      padding: 12px 16px;
      background: #2e0e0e; border: 1px solid #5b1a1a;
      border-radius: var(--radius); margin-top: 16px;
      font-size: 13px; color: #f87171;
    }
    .confirm-bar.show { display: flex; }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>

  <div class="main-content">
    <div class="topbar">
      <span class="page-title" id="topTitle">Snippet</span>
      <div class="topbar-actions">
        <a href="../index.html">
          <button class="btn-icon" title="Back to library">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
          </button>
        </a>
      </div>
    </div>

    <div class="view-wrap" id="viewWrap">
      <div class="breadcrumb">
        <a href="../index.html">Library</a>
        <span>›</span>
        <span id="bcTitle">Snippet</span>
      </div>

      <!-- Header -->
      <div class="snippet-header">
        <div class="snip-lang-badge" id="langBadge"></div>
        <div class="snip-meta">
          <div class="snip-title" id="snipTitle"></div>
          <div class="snip-desc"  id="snipDesc"></div>
          <div class="snip-pills" id="snipPills"></div>
        </div>
      </div>

      <!-- Actions -->
      <div class="action-bar">
        <button class="btn btn-primary" id="copyBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy code
        </button>
        <button class="btn btn-fav" id="favBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="favIcon"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span id="favLabel">Favorite</span>
        </button>
        <button class="btn btn-ghost" id="editBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Edit
        </button>
        <button class="btn btn-danger" id="deleteBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
          Delete
        </button>
      </div>

      <div class="confirm-bar" id="confirmBar">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        <span>Delete this snippet permanently?</span>
        <button class="btn btn-danger" id="confirmDelete" style="padding:5px 12px">Yes, delete</button>
        <button class="btn btn-ghost"  id="cancelDelete"  style="padding:5px 12px">Cancel</button>
      </div>

      <!-- Code panel -->
      <div class="code-panel">
        <div class="code-panel-head">
          <div class="lang-label">
            <span id="langDot" style="width:8px;height:8px;border-radius:50%;display:inline-block"></span>
            <span id="langLabel"></span>
          </div>
          <span class="line-count" id="lineCount"></span>
        </div>
        <div class="code-view">
          <div class="line-nums">
            <div class="line-num-col" id="lineNums"></div>
            <div class="code-body" id="codeBody"></div>
          </div>
        </div>
      </div>

      <!-- Meta -->
      <div class="meta-card" id="metaCard"></div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- Edit Modal (inline) -->
<div class="modal-backdrop" id="editModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:200;align-items:center;justify-content:center">
  <div style="background:var(--bg-2);border:1px solid var(--border);border-radius:var(--radius-lg);width:90%;max-width:620px;max-height:90vh;overflow-y:auto">
    <div style="padding:18px 20px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">
      <h2 style="font-size:15px;font-weight:600">Edit Snippet</h2>
      <button onclick="closeEdit()" style="width:28px;height:28px;border:none;background:none;color:var(--text-2);font-size:20px;cursor:pointer;border-radius:6px">✕</button>
    </div>
    <div style="padding:18px 20px;display:flex;flex-direction:column;gap:14px">
      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:12px;font-weight:600;color:var(--text-2)">Title</label>
        <input id="eTitle" type="text" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:8px 10px;outline:none;font-family:var(--sans)" />
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:12px;font-weight:600;color:var(--text-2)">Description</label>
        <input id="eDesc" type="text" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:8px 10px;outline:none;font-family:var(--sans)" />
      </div>
      <div style="display:flex;gap:12px">
        <div style="display:flex;flex-direction:column;gap:5px;flex:1">
          <label style="font-size:12px;font-weight:600;color:var(--text-2)">Language</label>
          <select id="eLang" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:8px 10px;outline:none"></select>
        </div>
        <div style="display:flex;flex-direction:column;gap:5px;flex:1">
          <label style="font-size:12px;font-weight:600;color:var(--text-2)">Category</label>
          <select id="eCat" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:8px 10px;outline:none"></select>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:12px;font-weight:600;color:var(--text-2)">Code</label>
        <textarea id="eCode" spellcheck="false" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:12px;padding:8px 10px;outline:none;font-family:var(--mono);resize:vertical;min-height:180px;line-height:1.6"></textarea>
      </div>
      <div style="display:flex;flex-direction:column;gap:5px">
        <label style="font-size:12px;font-weight:600;color:var(--text-2)">Tags (comma-separated)</label>
        <input id="eTags" type="text" style="background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;padding:8px 10px;outline:none;font-family:var(--sans)" />
      </div>
    </div>
    <div style="padding:14px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end">
      <button class="btn btn-ghost" onclick="closeEdit()">Cancel</button>
      <button class="btn btn-primary" onclick="saveEdit()">Save changes</button>
    </div>
  </div>
</div>

<script src="../js/data.js"></script>
<script src="../js/ui.js"></script>
<script>
  SV.initStore();
  document.getElementById('sidebar').innerHTML = buildSidebar('index');

  const id = new URLSearchParams(location.search).get('id');
  let snippet = id ? SV.getSnippetById(id) : null;

  if (!snippet) {
    document.getElementById('viewWrap').innerHTML = `
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        <strong>Snippet not found</strong>
        <p>It may have been deleted.</p>
        <button class="empty-btn" onclick="location.href='../index.html'">← Back to library</button>
      </div>`;
  } else {
    renderSnippet();
  }

  function renderSnippet() {
    const lang = SV.getLang(snippet.language);
    const cat  = SV.getCat(snippet.category);

    document.title = `${snippet.title} — SnipVault`;
    document.getElementById('topTitle').textContent = snippet.title;
    document.getElementById('bcTitle').textContent  = snippet.title;
    document.getElementById('snipTitle').textContent = snippet.title;
    document.getElementById('snipDesc').textContent  = snippet.description || '';

    const badge = document.getElementById('langBadge');
    badge.textContent = lang.abbr;
    badge.style.background = lang.bg;
    badge.style.color = lang.color;

    const dot = document.getElementById('langDot');
    dot.style.background = lang.color;
    document.getElementById('langLabel').textContent = lang.label;

    // pills
    let pillsHtml = `
      <span class="pill" style="background:${lang.bg};color:${lang.color};border-color:${lang.color}33">${lang.label}</span>
      <span class="pill">${cat.icon} ${cat.label}</span>
    `;
    (snippet.tags || []).forEach(t => { pillsHtml += `<span class="pill">${SV.escapeHtml(t)}</span>`; });
    document.getElementById('snipPills').innerHTML = pillsHtml;

    // code
    const lines = snippet.code.split('\n');
    document.getElementById('lineCount').textContent = `${lines.length} line${lines.length !== 1 ? 's' : ''}`;
    document.getElementById('lineNums').innerHTML = lines.map((_,i) => `<div>${i+1}</div>`).join('');
    document.getElementById('codeBody').textContent = snippet.code;

    // fav button
    updateFavBtn();

    // meta
    document.getElementById('metaCard').innerHTML = `
      <div class="meta-item"><div class="meta-label">Language</div><div class="meta-value">${lang.label}</div></div>
      <div class="meta-item"><div class="meta-label">Category</div><div class="meta-value">${cat.icon} ${cat.label}</div></div>
      <div class="meta-item"><div class="meta-label">Lines</div><div class="meta-value">${lines.length}</div></div>
      <div class="meta-item"><div class="meta-label">Created</div><div class="meta-value">${SV.timeAgo(snippet.createdAt)}</div></div>
      ${snippet.updatedAt ? `<div class="meta-item"><div class="meta-label">Updated</div><div class="meta-value">${SV.timeAgo(snippet.updatedAt)}</div></div>` : ''}
      <div class="meta-item"><div class="meta-label">Tags</div><div class="meta-value">${(snippet.tags||[]).join(', ') || '—'}</div></div>
    `;
  }

  function updateFavBtn() {
    const btn = document.getElementById('favBtn');
    const icon = document.getElementById('favIcon');
    const label = document.getElementById('favLabel');
    if (snippet.favorited) {
      btn.classList.add('active');
      icon.setAttribute('fill','currentColor');
      label.textContent = 'Favorited';
    } else {
      btn.classList.remove('active');
      icon.setAttribute('fill','none');
      label.textContent = 'Favorite';
    }
  }

  document.getElementById('copyBtn').addEventListener('click', () => {
    navigator.clipboard.writeText(snippet.code).then(() => showToast('Copied to clipboard'));
  });

  document.getElementById('favBtn').addEventListener('click', () => {
    snippet.favorited = SV.toggleFavorite(snippet.id);
    updateFavBtn();
    showToast(snippet.favorited ? 'Added to favorites' : 'Removed from favorites', snippet.favorited ? '★' : '☆');
  });

  document.getElementById('editBtn').addEventListener('click', openEdit);
  document.getElementById('deleteBtn').addEventListener('click', () => {
    document.getElementById('confirmBar').classList.add('show');
  });
  document.getElementById('cancelDelete').addEventListener('click', () => {
    document.getElementById('confirmBar').classList.remove('show');
  });
  document.getElementById('confirmDelete').addEventListener('click', () => {
    SV.deleteSnippet(snippet.id);
    showToast('Snippet deleted');
    setTimeout(() => location.href = '../index.html', 900);
  });

  // Edit modal
  document.getElementById('eLang').innerHTML = buildLangOptions();
  document.getElementById('eCat').innerHTML  = buildCatOptions();

  function openEdit() {
    document.getElementById('eTitle').value = snippet.title;
    document.getElementById('eDesc').value  = snippet.description || '';
    document.getElementById('eLang').value  = snippet.language;
    document.getElementById('eCat').value   = snippet.category;
    document.getElementById('eCode').value  = snippet.code;
    document.getElementById('eTags').value  = (snippet.tags || []).join(', ');
    const m = document.getElementById('editModal');
    m.style.display = 'flex';
  }
  function closeEdit() { document.getElementById('editModal').style.display = 'none'; }
  function saveEdit() {
    const title = document.getElementById('eTitle').value.trim();
    const code  = document.getElementById('eCode').value.trim();
    if (!title || !code) { showToast('Title and code are required', '⚠'); return; }
    snippet = {
      ...snippet,
      title,
      description: document.getElementById('eDesc').value.trim(),
      language:    document.getElementById('eLang').value,
      category:    document.getElementById('eCat').value,
      code,
      tags:        document.getElementById('eTags').value.split(',').map(t=>t.trim()).filter(Boolean),
      updatedAt:   Date.now(),
    };
    SV.saveSnippet(snippet);
    closeEdit();
    renderSnippet();
    showToast('Snippet updated');
  }
  window.closeEdit = closeEdit;
  window.saveEdit  = saveEdit;
</script>
</body>
</html>
