<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SnipVault — Favorites</title>
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="app-shell">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <div class="topbar">
      <span class="page-title">⭐ Favorites</span>
      <div class="search-wrap">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="Search favorites…" />
      </div>
    </div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="card-grid" id="cardGrid"></div>
  </div>
</div>
<div id="toast"></div>
<script src="../js/data.js"></script>
<script src="../js/ui.js"></script>
<script>
  SV.initStore();
  document.getElementById('sidebar').innerHTML = buildSidebar('favorites');

  let searchQ = '';
  let filterLang = '';

  function buildFilterBar() {
    const favs = SV.getSnippets().filter(s => s.favorited);
    const usedLangs = [...new Set(favs.map(s => s.language))];
    let html = `<button class="filter-chip ${!filterLang ? 'active' : ''}" onclick="setLang('')">All</button>`;
    usedLangs.forEach(id => {
      const l = SV.getLang(id);
      html += `<button class="filter-chip ${filterLang === id ? 'active' : ''}" onclick="setLang('${id}')">
        <span class="chip-dot" style="background:${l.color}"></span>${l.label}
      </button>`;
    });
    document.getElementById('filterBar').innerHTML = html;
  }

  function setLang(l) { filterLang = l; renderGrid(); buildFilterBar(); }

  function renderGrid() {
    let snippets = SV.getSnippets().filter(s => s.favorited);
    if (filterLang) snippets = snippets.filter(s => s.language === filterLang);
    if (searchQ) {
      const q = searchQ.toLowerCase();
      snippets = snippets.filter(s =>
        s.title.toLowerCase().includes(q) ||
        (s.description||'').toLowerCase().includes(q) ||
        (s.tags||[]).some(t => t.toLowerCase().includes(q))
      );
    }
    const grid = document.getElementById('cardGrid');
    if (!snippets.length) {
      grid.innerHTML = `<div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <strong>No favorites yet</strong>
        <p>Star snippets from the library to see them here.</p>
        <button class="empty-btn" onclick="location.href='../index.html'">Browse library</button>
      </div>`;
      return;
    }
    grid.innerHTML = snippets.map(s => buildCard(s, '../')).join('');
  }

  document.getElementById('searchInput').addEventListener('input', e => {
    searchQ = e.target.value.trim(); renderGrid();
  });

  buildFilterBar();
  renderGrid();
</script>
</body>
</html>
